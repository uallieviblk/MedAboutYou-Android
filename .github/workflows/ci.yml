name: CI

# Keep the documented quality gates green on every push/PR: JVM unit tests,
# Android Lint (0 errors), and detekt (report-only but must run). Instrumented
# tests need an emulator and stay a local/manual step (see docs/ANALYSIS.md).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: detekt
        run: ./gradlew detekt

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          if-no-files-found: ignore
